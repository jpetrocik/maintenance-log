<div id="carList">
  <mat-button-toggle-group class="fw" name="carList" vertical >
    @for (car of _maintenanceService.myGarage$ | async; track car) {
      <mat-button-toggle class="btn" (click)="selectVehicle(car)">{{car.name}} <small>({{car.mileageReportedDays}} days ago)</small></mat-button-toggle >
    }
  </mat-button-toggle-group>
</div>
