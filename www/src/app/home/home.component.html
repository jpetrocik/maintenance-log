<div id="carList">
  <mat-button-toggle-group class="fw" name="carList" vertical >
    @for (vehicle of _maintenanceService.myGarage$ | async; track vehicle) {
      <mat-button-toggle class="btn" [routerLink]="['/mileage', vehicle.invitationToken]">{{vehicle.name}} <small>({{vehicle.mileageReportedDays}} days ago)</small></mat-button-toggle >
    }
  </mat-button-toggle-group>
</div>

<div>
  <a
    [routerLink]="['/my-garage/register']">
    Add Vehicle
  </a>
</div>
